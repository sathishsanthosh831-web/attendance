<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Attendance System</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
   .box {
      background: white;
      padding: 40px 30px;
      border-radius: 20px;
      box-shadow: 0 15px 50px rgba(0,0,0,0.3);
      max-width: 450px;
      width: 100%;
    }
    h1 { color: #333; margin-bottom: 10px; text-align: center; }
   .date { color: #666; text-align: center; margin-bottom: 25px; font-size: 14px; }
    input {
      width: 100%;
      padding: 14px;
      margin: 10px 0;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      font-size: 16px;
      transition: 0.3s;
    }
    input:focus { outline: none; border-color: #667eea; }
    button {
      width: 100%;
      padding: 15px;
      font-size: 18px;
      font-weight: bold;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      margin-top: 15px;
      transition: 0.3s;
    }
    button:hover { background: #5568d3; transform: scale(1.02); }
    button:disabled { background: #ccc; cursor: not-allowed; }
    #msg {
      margin-top: 20px;
      padding: 12px;
      border-radius: 8px;
      text-align: center;
      font-size: 15px;
      display: none;
    }
   .success { background: #d4edda; color: #155724; display: block!important; }
   .error { background: #f8d7da; color: #721c24; display: block!important; }
   .icon { font-size: 50px; text-align: center; margin-bottom: 15px; }
  </style>
</head>
<body>
  <div class="box">
    <div class="icon">📋</div>
    <h1>Attendance Mark Pannu</h1>
    <div class="date" id="date">Loading...</div>

    <input type="text" id="name" placeholder="Un Name" autocomplete="off">
    <input type="text" id="roll" placeholder="Roll Number" autocomplete="off">
    <button id="markBtn" onclick="markAttendance()">Present Podu ✅</button>

    <div id="msg"></div>
  </div>

  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-analytics.js";
    import { getDatabase, ref, push, set } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-database.js";

    // Un Firebase Config
    const firebaseConfig = {
      apiKey: "AIzaSyCJQwlKiwx7Qtcp8d46QQd9gkHfsVX5j20",
      authDomain: "atte-73d96.firebaseapp.com",
      databaseURL: "https://atte-73d96-default-rtdb.firebaseio.com",
      projectId: "atte-73d96",
      storageBucket: "atte-73d96.firebasestorage.app",
      messagingSenderId: "286212566095",
      appId: "1:286212566095:web:ba1177cca497de36968e3a",
      measurementId: "G-BCX84PH05W"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const analytics = getAnalytics(app);
    const db = getDatabase(app);

    // Date kaatu
    document.getElementById('date').innerText = new Date().toLocaleDateString('en-IN', {
      weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
    });

    // Attendance Mark Panna Function
    window.markAttendance = async function() {
      const name = document.getElementById('name').value.trim();
      const roll = document.getElementById('roll').value.trim();
      const msg = document.getElementById('msg');
      const btn = document.getElementById('markBtn');

      if (!name ||!roll) {
        msg.className = 'error';
        msg.innerText = '❌ Name & Roll Number podu da';
        return;
      }

      btn.disabled = true;
      btn.innerText = 'Saving...';

      try {
        const today = new Date().toISOString().split('T')[0]; // 2026-06-24
        const attendanceRef = ref(db, `attendance/${today}/${roll}`);

        await set(attendanceRef, {
          name: name,
          rollNo: roll,
          timestamp: new Date().toISOString(),
          time: new Date().toLocaleTimeString('en-IN'),
          status: 'Present'
        });

        msg.className = 'success';
        msg.innerText = `✅ ${name} - Attendance marked da!`;
        document.getElementById('name').value = '';
        document.getElementById('roll').value = '';

      } catch (e) {
        msg.className = 'error';
        msg.innerText = '❌ Error: ' + e.message;
      }

      btn.disabled = false;
      btn.innerText = 'Present Podu ✅';
    }
  </script>
</body>
</html>
