<!DOCTYPE html>
<html>
<head>
  <title>Attendance System</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { font-family: Arial; padding: 20px; background: #f5f5f5; }
    .box { background: white; padding: 30px; border-radius: 10px; max-width: 400px; margin: auto; }
    button { padding: 12px 25px; background: #1976d2; color: white; border: none; border-radius: 8px; cursor: pointer; }
    input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 5px; }
  </style>
</head>
<body>
  <div class="box">
    <h2>Attendance Mark Pannu</h2>
    <input type="text" id="name" placeholder="Un Name">
    <input type="text" id="roll" placeholder="Roll Number">
    <button onclick="markAttendance()">Present Podu</button>
    <p id="msg"></p>
  </div>

  <!-- Firebase v9 SDK -->
  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
    import { getFirestore, collection, addDoc } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

    // Un config da
    const firebaseConfig = {
      apiKey: "AIzaSyAmBObp5M9XsgkMR-bHHvd8WygJsR-9_xo",
      authDomain: "attendance-8257e.firebaseapp.com",
      projectId: "attendance-8257e",
      storageBucket: "attendance-8257e.firebasestorage.app",
      messagingSenderId: "897935484063",
      appId: "1:897935484063:web:a3c5a0a5ffbc4d3d0eeeaa",
      measurementId: "G-H68F4QKF1S"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Attendance mark panna function
    window.markAttendance = async function() {
      const name = document.getElementById('name').value;
      const roll = document.getElementById('roll').value;
      const msg = document.getElementById('msg');
      
      if (!name || !roll) {
        msg.innerText = 'Name & Roll Number podu da';
        return;
      }

      try {
        await addDoc(collection(db, 'attendance'), {
          name: name,
          rollNo: roll,
          time: new Date(),
          date: new Date().toLocaleDateString('en-IN')
        });
        msg.innerText = '✅ Attendance marked da!';
        document.getElementById('name').value = '';
        document.getElementById('roll').value = '';
      } catch (e) {
        msg.innerText = '❌ Error: ' + e.message;
      }
    }
  </script>
</body>
</html>
