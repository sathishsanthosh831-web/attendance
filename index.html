<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance System</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            text-align: center;
            width: 90%;
            max-width: 400px;
        }
        h1 { color: #333; margin-bottom: 30px; }
        button {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        .student-btn { background: #4CAF50; color: white; }
        .student-btn:hover { background: #45a049; transform: scale(1.05); }
        .admin-btn { background: #2196F3; color: white; }
        .admin-btn:hover { background: #0b7dda; transform: scale(1.05); }
        .form-section { display: none; margin-top: 20px; }
        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }
        .submit-btn { background: #ff5722; color: white; }
        .back-btn { background: #9e9e9e; color: white; }
        .status { margin-top: 15px; font-weight: bold; }
        .success { color: green; }
        .error { color: red; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Attendance System</h1>
        
        <div id="homeSection">
            <button class="student-btn" id="studentBtn">Student Login</button>
            <button class="admin-btn" id="adminBtn">Admin Login</button>
        </div>

        <div id="studentSection" class="form-section">
            <h2>Student Attendance</h2>
            <input type="text" id="studentName" placeholder="Your Name">
            <input type="text" id="studentRoll" placeholder="Roll Number">
            <button class="submit-btn" id="markAttendance">Mark Attendance</button>
            <button class="back-btn" id="backFromStudent">Back</button>
            <div id="studentStatus" class="status"></div>
        </div>

        <div id="adminSection" class="form-section">
            <h2>Admin Panel</h2>
            <input type="password" id="adminPass" placeholder="Admin Password">
            <button class="submit-btn" id="viewAttendance">View All Attendance</button>
            <button class="back-btn" id="backFromAdmin">Back</button>
            <div id="adminStatus" class="status"></div>
            <div id="attendanceList"></div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        // Import Firebase
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getDatabase, ref, push, onValue } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js';

        // UN CONFIG - Idha maatha vendam, un project dhan
        const firebaseConfig = {
            apiKey: "AIzaSyC...", // Config la irundhu copy pannu
            authDomain: "atte-73d96.firebaseapp.com",
            databaseURL: "https://atte-73d96-default-rtdb.firebaseio.com", // ✅ Un URL
            projectId: "atte-73d96",
            storageBucket: "atte-73d96.appspot.com",
            messagingSenderId: "286212566095",
            appId: "1:286212566095:web:be1177cca497de36968e3a"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);

        // UI Elements
        const homeSection = document.getElementById('homeSection');
        const studentSection = document.getElementById('studentSection');
        const adminSection = document.getElementById('adminSection');

        // Show/Hide Functions
        function showStudentLogin() {
            homeSection.style.display = 'none';
            studentSection.style.display = 'block';
            adminSection.style.display = 'none';
        }

        function showAdminLogin() {
            homeSection.style.display = 'none';
            adminSection.style.display = 'block';
            studentSection.style.display = 'none';
        }

        function goBack() {
            homeSection.style.display = 'block';
            studentSection.style.display = 'none';
            adminSection.style.display = 'none';
        }

        // Button Events
        document.getElementById('studentBtn').onclick = showStudentLogin;
        document.getElementById('adminBtn').onclick = showAdminLogin;
        document.getElementById('backFromStudent').onclick = goBack;
        document.getElementById('backFromAdmin').onclick = goBack;

        // Mark Attendance
        document.getElementById('markAttendance').onclick = () => {
            const name = document.getElementById('studentName').value.trim();
            const roll = document.getElementById('studentRoll').value.trim();
            const status = document.getElementById('studentStatus');

            if (!name || !roll) {
                status.textContent = 'Name and Roll Number required da!';
                status.className = 'status error';
                return;
            }

            const attendanceRef = ref(database, 'attendance');
            push(attendanceRef, {
                name: name,
                roll: roll,
                timestamp: new Date().toLocaleString(),
                date: new Date().toLocaleDateString()
            }).then(() => {
                status.textContent = 'Attendance marked successfully! ✅';
                status.className = 'status success';
                document.getElementById('studentName').value = '';
                document.getElementById('studentRoll').value = '';
            }).catch((error) => {
                status.textContent = 'Error: ' + error.message;
                status.className = 'status error';
            });
        };

        // Admin View Attendance
        document.getElementById('viewAttendance').onclick = () => {
            const pass = document.getElementById('adminPass').value;
            const status = document.getElementById('adminStatus');
            const list = document.getElementById('attendanceList');

            if (pass !== 'admin123') {
                status.textContent = 'Wrong password da!';
                status.className = 'status error';
                return;
            }

            status.textContent = 'Loading...';
            status.className = 'status';

            const attendanceRef = ref(database, 'attendance');
            onValue(attendanceRef, (snapshot) => {
                const data = snapshot.val();
                if (!data) {
                    list.innerHTML = '<p>No attendance yet da</p>';
                    return;
                }

                let html = '<h3>Today Attendance:</h3><table style="width:100%; margin-top:10px; border-collapse: collapse;">';
                html += '<tr style="background:#f0f0f0;"><th style="padding:8px; border:1px solid #ddd;">Name</th><th style="padding:8px; border:1px solid #ddd;">Roll</th><th style="padding:8px; border:1px solid #ddd;">Time</th></tr>';
                
                Object.values(data).forEach(item => {
                    html += `<tr>
                        <td style="padding:8px; border:1px solid #ddd;">${item.name}</td>
                        <td style="padding:8px; border:1px solid #ddd;">${item.roll}</td>
                        <td style="padding:8px; border:1px solid #ddd;">${item.timestamp}</td>
                    </tr>`;
                });
                html += '</table>';
                list.innerHTML = html;
                status.textContent = 'Data loaded ✅';
                status.className = 'status success';
            });
        };
    </script>
</body>
</html>
